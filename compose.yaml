services:
  bridge:
    image: ghcr.io/jycao2/hongguotv-bridge:${HONGGUOTV_VERSION:-0.1.1}
    ports:
      - "${BRIDGE_BIND_IP:-0.0.0.0}:${BRIDGE_PORT:-8787}:8787"
    environment:
      BRIDGE_HOST: 0.0.0.0
      PORT: 8787
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
