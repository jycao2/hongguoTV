name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.27.0+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.27.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- **遥控地址永久有效**：首次扫码后地址一直有效，手机下次直接打开旧地址就能连，电视端不用再开二维码窗"
            echo "- **新增界面缩放**：「设置 → 外观与界面」可把整个界面在 标准 / 大 / 特大 三档间切换，离电视远也能看清字，背景一起放大"
            echo "- **新增播放屏鼠标手势**：鼠标上滑下一集、下滑上一集，单击呼出/收起控制条"
            echo "- **遥控上下键可直切集数**：播放设置新增「切换集数」模式，↓=下一集、↑=上一集"
            echo "- **二维码弹窗重做**：码更小、白框更薄，右侧文案与码对齐；地址完整显示并强制换行，扫码失败可照着手输"
            echo "- **弹窗不再闪跳**：所有弹窗首帧出现在最终位置，不再先闪别处再飞过去"
            echo "- **顶栏高密度屏适配**：小宽度电视不再把「设置」挤出屏幕"
            echo "- **播放接口空响应自愈**：持续空响应时自动换设备身份重试，无需杀进程重进"
            echo "- **细节修复**：最近观看卡片上键无反应、随机荐剧弹窗超出小屏、片源源卡片对齐、顶栏遥控入口不再常驻 IP 等"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
