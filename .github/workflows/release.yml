name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.26.0+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.26.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- **新增本地库**：接入 WebDAV/NAS，扫描目录、缓存剧集，点击即全屏播放；连接支持手机扫码填写，连接信息仅存本机、不随备份导出。本地库入口默认隐藏，需要时可在「设置 → 外观与界面 → 导航模块」中打开"
            echo "- **全屏播放器控制条**：暂停/播放、上一集/下一集、快退/快进 15 秒、倍速、单集循环、画面比例；下键唤出或收起控制条，隐藏时按右键直接快进，长按 3 倍速"
            echo "- **影片详情弹窗更紧凑**：海报与右侧文案顶部对齐；添加连接表单字段带示例与「可留空」标注，与手机扫码表单一致"
            echo "- **片源入口改为默认隐藏**：此前升级会强制显示一次，现在与本地库一样默认隐藏，可在「导航模块」中打开，并随本地备份迁移"
            echo "- **观看历史新增云端记录刷新**：登录红果账号后，可在「最近观看」手动刷新红果云端观看记录，只读展示，不覆盖本机记录"
            echo "- **修复列表焦点**：翻页或列表重排后下键不再跳回顶栏「首页」，卡片网格内稳定下移"
            echo "- **修复部分剧集无法降档**：720P 及以上全为 bytevc2 编码时只能选到无法解码的 1080P，现与官方现行的取流接口使用一致的设备等级"
            echo "- **手机扫码填写页**：密码字段改为密码框，不明文显示"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
