name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.22.0+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.22.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- 接口自检：设置页新增首页/搜索/播放/联想四项连通性检测，按钮内状态圆点灰/绿/红标识结果，各按钮独立 3 秒冷却防连点"
            echo "- 弹幕关键词屏蔽：自定义屏蔽词，命中弹幕不再显示；支持按剧单独记忆弹幕开关"
            echo "- 不兼容集处理：遇到平台未提供标准编码的集数时明确提示，可一键播放下一集，支持自动连续跳过（上限 5 集）"
            echo "- 本机观看统计：本地统计观看数据，不上传"
            echo "- 遥控器按键自定义：播放界面按键行为可按习惯调整"
            echo "- 片源测速优选：多源影片自动测速并优选更快的源"
            echo "- 详情页季导航：多季剧集详情页可直接跳转到指定季"
            echo "- 弹窗统一美化：全部弹窗改为深色玻璃卡片、圆角与胶囊焦点按钮，跨模块风格一致"
            echo "- 搜索联想词超长获焦横向滚动，不再省略号截断"
            echo "- 修复搜索结果卡片海报大小不一、集数文字覆盖片名"
            echo "- 收藏「检查更新」按钮增加空态/进行中/开始的明确提示"
            echo "- 排行榜切换榜单或刷新后焦点稳定落在第一张卡片"
            echo "- 设置页「接口自检」可被遥控器正常聚焦（焦点链与视觉顺序对齐）"
            echo "- 片源列表支持遥控器左键唤出删除确认"
            echo "- 片源搜索联想剥离 HTML 标签恢复正常出结果；返回链路修复为「结果页→搜索页→片源首页」两次返回退出"
            echo "- 修复弹幕屏蔽词勾选未保存、设置页焦点顺序错位"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
