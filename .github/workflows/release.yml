name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10400 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.31.1+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.31.1-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "**新功能**"
            echo ""
            echo "- 播放页鼠标快捷按钮：底部一行「播放 / 暂停 · 选集 · 收藏」，鼠标一动浮现，静止 3 秒自动收起；主播放器与第三方片源一致"
            echo "- 快捷按钮配色跟随系统主题，控制条展开时自动让位，不遮挡画面"
            echo ""
            echo "**修复**"
            echo ""
            echo "- 倍速播放自动连播下一集时音画不同步（画面回 1 倍速、声音维持原倍速），在线播放与 NAS 本地库均已修复"
            echo "- 排行榜、上新、AI 剧榜翻页后焦点跳回第一张卡片，鼠标滚轮不再与焦点来回抢"
            echo "- 鼠标上下滑动换集不再弹出控制条和按键提示，遥控器换集仍保留提示"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify channel APK minSdk matches manifest (26)
        run: |
          SDK=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging kotlin-tv/app/build/outputs/apk/release/app-release.apk | sed -n "s/^minSdkVersion: *'\([0-9]*\)'.*/\1/p")
          echo "channel APK minSdk=$SDK"
          test "$SDK" = 26
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - name: Build Android 5-7 variant (minSdk 21) and attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: |
          ./kotlin-tv/gradlew -p kotlin-tv -PHONGGUOTV_MIN_SDK=21 :app:assembleRelease --console=plain
          mkdir -p outputs
          cp kotlin-tv/app/build/outputs/apk/release/app-release.apk "outputs/hongguotv-kotlin-$HONGGUOTV_VERSION_NAME-android5.apk"
          SDK=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "outputs/hongguotv-kotlin-$HONGGUOTV_VERSION_NAME-android5.apk" | sed -n "s/^minSdkVersion: *'\([0-9]*\)'.*/\1/p")
          echo "android5 APK minSdk=$SDK"
          test "$SDK" = 21
          gh release upload "$UPDATE_TAG" "outputs/hongguotv-kotlin-$HONGGUOTV_VERSION_NAME-android5.apk" --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
