name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10600 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.37.1+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.37.1-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "**繁中显示**：繁中介面下剧名、简介、弹幕、评论自动转繁体，搜索繁体自动转简；发给平台的数据保持原样"
            echo "**繁体应用名**：系统语言为繁中时桌面图标显示「紅果TV」"
            echo "**验证码限频**：境外号触发官方发送频控时给出明确间隔说明，可直达扫码登录，不再反复发送"
            echo "**自动更新修复**：换用可用镜像源、失败 10 分钟重试、检查结果在设置里可见、不再被屏保吞掉提示"
            echo "**每次启动检查更新**：重启后首次检查不再受 6 小时节流影响，单源超时缩短到 8 秒"
            echo "**版本号精简**：界面显示与安装包名只显示 X.Y.Z，不再带 +构建号；完整构建号仍在更新面板里"
            echo "**换集绿闪修复**：换集时不再闪约 0.07 秒绿屏"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Verify channel APK minSdk matches manifest (21)
        run: |
          SDK=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging kotlin-tv/app/build/outputs/apk/release/app-release.apk | sed -n "s/^minSdkVersion: *'\([0-9]*\)'.*/\1/p")
          echo "channel APK minSdk=$SDK"
          test "$SDK" = 21
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
