name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.28.0+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.28.0-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- **切集不再弹自动重试**：播放就绪后批量预热前后共 15 集取址，手动切集直接命中缓存，不再先转圈倒计时；首帧明显变快"
            echo "- **快速切集不再误报失败**：上一集/下一集被取流取消时不再当成播放失败暂停并弹面板；自动重试只显示居中转圈，预算耗尽或不可恢复才出按钮"
            echo "- **逐集记忆播放位置**：换集后回看上一集能接着上次看到的位置播，不再从头开始"
            echo "- **搜索与排行榜上键修复**：网格首行按上键先回页头按钮（看榜/刷新、搜索输入行），再按一次才回顶栏；向上找卡时滚动方向不再反向"
            echo "- **界面缩放改弹窗选档**：档位改为弹窗直接选，新增比「特大」更大的「极大」；切换系统风格/缩放后回到原设置项，不再被扔回首页"
            echo "- **遥控在线设备数按 IP 去重**：同一手机多标签/多浏览器只算一台；遥控页补全屏按钮"
            echo "- **应用图标改为自适应矢量图标**：删除各密度 PNG，改用矢量背景/前景/单色层，适配 Android 8+ 自适应图标"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
