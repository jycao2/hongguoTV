name: Build and publish TV update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tv-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set monotonic build version and restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_CODE=$((10400 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "HONGGUOTV_VERSION_NAME=0.30.9+$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=kotlin-v0.30.9-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          {
            echo "RELEASE_NOTES<<RELEASE_NOTES_END"
            echo "- **自动更新链路修复（0.30.8 用户必升）**：0.30.8 的更新清单改用了新 APK 命名（-android5）且声明 minSdk 21，而 0.28.0 及更早客户端的解析器只认 -android8 命名与 minSdk≥26，导致存量用户检查更新报「更新信息格式不正确」、永远收不到新版。本版起清单恢复 -android8 命名与 minSdk 26 声明（实际包仍支持 Android 5.0），并放宽新客户端解析为两种命名兼容"
            echo "- **一句话遥控（本版重点）**：手机遥控页新增「一句话」输入，说剧名直接搜、说指令直接做，回执以提示条播报。支持 47 种说法：\`我要看文盲修仙的第七集\`、\`快进30秒\`、\`后退15秒\`、\`1.5倍速\`、\`返回上一级\`、\`随机推荐一部漫剧\`、\`登录红果账户\`、\`打开选集\`、\`跳到片尾\`、\`静音\`、\`音量加\`、\`半小时后关掉\`、\`切到短剧\`……完整清单见仓库 \`docs/voice-cheatsheet.md\`"
            echo "- **搜索只列结果、不自动播放**：说剧名只把结果摆出来，看哪部自己点；只有说清集数才直达那一集。当前库搜不到时自动换到漫剧/短剧库重搜一次"
            echo "- **快传与历史也能说**：\`刷新二维码\`、\`打开快传文件\`、\`清空文件\`、\`清空搜索历史\`——说出口即执行，回执报数量和体积"
            echo "- **电视内置小爱语音入口**：经巴法云中转，电视常连 MQTT（修掉「设备不在线」），手机小爱说任意剧名即可送到电视开播；多用户各自接入互不干扰"
            echo "- **播放页鼠标操作（新增）**：进度条可以直接拖（轨道 4dp、可点区 26dp，拖动时暂停刷新、松手精确跳转，条上滚轮 ±10 秒）；右上角新增「✕ 退出」，鼠标右键也能退出播放"
            echo "- **鼠标按钮只在用鼠标时出现**：退出按钮与鼠标手势提示仅当最近一次操作来自鼠标才显示，按一下遥控立即收起。TCL 的红外鼠标棒会被系统伪装成触摸屏，所以按事件来源判断而不是按插着什么设备判断"
            echo "- **上下滑换集方向修正**：上滑=下一集、下滑=上一集。此前的实现里慢速拖动方向是反的（快速甩动反而正常），本版修正"
            echo "- **触摸模式下返回键失灵（重点修复）**：用鼠标棒点过画面后返回键就没反应、焦点僵在卡片上，只能拔电源。根因是窗口进入触摸模式后首页胶囊按钮取不到焦点，已补触摸模式可聚焦属性，并在焦点回收失败时兜底弹出退出确认"
            echo "- **片源播放修复 110001**：播放接口迁移到新的五头签名，签名过期导致的整片源不可播已恢复"
            echo "- **聚合搜索不再卡死**：加 8 秒总时限，到点放弃没返回的慢源，已到的结果立即展示并标出超时源，不再永远停在「正在聚合 1/6」"
            echo "- **片源详情加系列剧切换条**；片源不兼容面板补「播放上一集」；降级模型补诊断标记与多轮重试"
            echo "- **排行榜新增「上新」**：按时间窗看新上架的剧，时间窗改为弹层选择，页头焦点链补齐"
            echo "- **手机遥控页横屏/全屏打磨**：全屏不再被浏览器掰成横向、保留退出按钮、横屏改两栏、选集改多列、长片名不再撑宽卡片、横屏内容可滚动不丢卡片、全量记录弹层不再一屏两张巨图"
            echo "- **界面与焦点**：详情翻页后焦点留在翻页按钮；修多季剧跳季后丢失其它季、剧名里混进简介；信息弹窗高度封顶，遥控上下键直接翻正文；设置新增「实验室功能」分组"
            echo "- **兼容性与稳定性**：最低版本下探到 Android 5.0（API 21），修复低版本 API 越界崩溃；修重建后账号回调崩溃；手动检查更新不再受页面限制"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_ENV"
      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:lintRelease :app:assembleRelease --console=plain
      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
