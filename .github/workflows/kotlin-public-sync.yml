name: Sync native source to public update channel
on:
  push:
    branches: ['codex/kotlin-standalone']
    paths: ['kotlin-tv/**', 'scripts/build-kotlin.sh', 'scripts/sync-kotlin-public.py', '.github/workflows/kotlin-public-sync.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tv-public-source
  cancel-in-progress: false
jobs:
  sync:
    if: vars.TV_UPDATES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure repository-scoped deploy key
        env:
          DEPLOY_KEY: ${{ secrets.TV_UPDATES_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/tv-update-key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$RUNNER_TEMP/tv-update-hosts"
          echo "GIT_SSH_COMMAND=ssh -i $RUNNER_TEMP/tv-update-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/tv-update-hosts" >> "$GITHUB_ENV"
      - name: Export approved native sources and push
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:jycao2/hongguoTV-updates.git "$RUNNER_TEMP/public-tv"
          python3 scripts/sync-kotlin-public.py "$RUNNER_TEMP/public-tv"
          cd "$RUNNER_TEMP/public-tv"
          git config user.name 'hongguoTV release'
          git config user.email 'hongguotv-release@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "Sync native client ${GITHUB_SHA:0:12}"
            git push origin HEAD:main
          fi
      - name: Remove temporary deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/tv-update-key"
